<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Software Evaluation System</title>
  <style>
    body { font-family: sans-serif; max-width: 900px; margin: 2em auto; padding: 0 1em; }
    nav a { margin-right: 1em; }
    table { border-collapse: collapse; margin-top: 1em; }
    th, td { border: 1px solid #ccc; padding: 6px 10px; text-align: left; }
    th { background: #eee; }
    .flash { background: #ffe9a8; border: 1px solid #d4a017; padding: 10px; margin: 1em 0; }
    label { display: block; margin: 0.6em 0 0.2em; }
    input, select, button { padding: 6px; }
    button { margin-top: 1em; }
  </style>
</head>
<body>
  <h1>Software Evaluation &amp; Comparison System</h1>
  <nav>
    <a href="{{ url_for('index') }}">Home</a>
    <a href="{{ url_for('rankings') }}">Rankings</a>
    <a href="{{ url_for('compare') }}">Compare</a>
    <a href="{{ url_for('search') }}">Search</a>
    <a href="{{ url_for('add_evaluation') }}">Add Evaluation</a>
    <a href="{{ url_for('add_software') }}">Add Software</a>
  </nav>
  <hr>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for m in messages %}<div class="flash">{{ m }}</div>{% endfor %}
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</body>
</html>
